name: SuperGaming
description: >-
  SuperGaming is a Series B-funded game development studio building multiplayer
  games "for the next billion players" in emerging markets. Headquartered in
  Singapore with a studio in Pune, India, the company develops and operates
  titles including Indus (battle royale), Prime Rush, Prime Rush MENA, SHOWDOWN,
  MaskGun (110M+ installs), Tower Conquest, and Silly Royale. SuperGaming also
  runs SuperPlatform, a proprietary real-time multiplayer and live-ops engine
  that powers its own games and 15+ other titles, and offers publisher services
  such as co-development, LiveOps-as-a-service, localization, and user
  acquisition. As of this enrichment pass the company publishes no public
  developer API, SDK, or developer portal for external developers; SuperPlatform
  is an internal engine offered through partnerships rather than a self-serve
  API. This profile was surfaced as a portfolio company of a16z.
